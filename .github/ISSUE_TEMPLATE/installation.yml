name: Installation help / 安装问题
description: Report a failure in basic, PDF or local speech setup.
body:
  - type: markdown
    attributes:
      value: "Keep system security enabled. Provide the last redacted error, not your full used installation folder. / 保持系统防护开启，仅提供脱敏报错。"
  - type: input
    id: version
    attributes:
      label: Downloaded version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows 10/11 x64
        - Other / manual Python setup
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Setup profile
      options:
        - basic
        - pdf
        - speech
        - full
        - launch only
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Command or script, steps and last error
      description: Include Python version if known. Replace account names and local paths with placeholders.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no keys, recordings, transcripts or private runtime data.
          required: true
