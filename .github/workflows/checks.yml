name: Software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic-checks:
    name: Software checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Optional PDF test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python synthetic checks
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Windows basic setup without package or model downloads
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./bootstrap-windows.ps1 -Profile basic -Yes -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Test-Path models) -or (Test-Path .portable) -or (Test-Path .runtime)) {
            throw 'Basic setup unexpectedly created optional model, package or runtime data.'
          }
      - name: Mac basic setup without package or model downloads
        if: runner.os == 'macOS'
        run: zsh ./bootstrap-mac.command --profile basic --yes --no-launch
      - name: Buildless interface checks
        run: |
          node tests/test_i18n.cjs
          node tests/test_paragraphs.cjs
          node tests/test_playback.cjs
          node tests/test_panels.cjs
          node tests/test_journey.cjs
